[project]
name = "team-operations-platform"
version = "0.1.0"
description = "Backend API for managing users, teams, and tasks."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "greenlet>=3.0,<4.0",
    "pwdlib[argon2]>=0.1,<1.0",
    "pyjwt>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
"app/core/authorization.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]